<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" width="240" height="60" aria-label="LPU Campus Clubs Logo">
  <defs>
    <linearGradient id="lpuOrangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>
    <filter id="badgeShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.15"/>
    </filter>
  </defs>
  
  <!-- Emblem Badge -->
  <g transform="translate(6, 6)" filter="url(#badgeShadow)">
    <!-- Outer Shield / Hex Rounded Box -->
    <rect x="0" y="0" width="48" height="48" rx="12" fill="url(#lpuOrangeGrad)"/>
    
    <!-- White Crest Ring -->
    <circle cx="24" cy="24" r="18" fill="none" stroke="#FFFFFF" stroke-width="1.8" opacity="0.9"/>
    
    <!-- Torch / Flame Symbol (Knowledge & Youth) -->
    <path d="M24 11 C26 15, 29 17, 28 21 C27 24, 25 25, 24 28 C23 25, 21 24, 20 21 C19 17, 22 15, 24 11 Z" fill="#FFFFFF"/>
    <!-- Inner Flame Glow -->
    <path d="M24 17 C25 19, 26 20, 25.5 22 C25 23.5, 24.5 24, 24 25.5 C23.5 24, 23 23.5, 22.5 22 C22 20, 23 19, 24 17 Z" fill="#FDBA74"/>
    <!-- Torch Base / Open Book -->
    <path d="M16 29 Q24 27 32 29 L32 31 Q24 29 16 31 Z" fill="#FFFFFF"/>
    <path d="M18 32 Q24 30.5 30 32 L30 33 Q24 31.5 18 33 Z" fill="#FFFFFF" opacity="0.8"/>
    <!-- Academic Cap Accent -->
    <polygon points="24,34 31,37 24,40 17,37" fill="#FFFFFF"/>
  </g>

  <!-- Typography: LPU CAMPUS CLUBS -->
  <g transform="translate(64, 14)">
    <!-- LPU Bold Acronym -->
    <text x="0" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="900" fill="#EA580C" letter-spacing="1">LPU</text>
    <!-- Divider Dot -->
    <circle cx="48" cy="12" r="2.5" fill="#94A3B8"/>
    <!-- Campus Clubs -->
    <text x="56" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0F172A" letter-spacing="0.5">CAMPUS CLUBS</text>
    <!-- Subtitle / Tagline -->
    <text x="0" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="600" fill="#64748B" letter-spacing="1.2">STUDENT ACTIVITIES &amp; EVENTS</text>
  </g>
</svg>
